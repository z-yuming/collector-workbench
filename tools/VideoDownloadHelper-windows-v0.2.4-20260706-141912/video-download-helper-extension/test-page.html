<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Grab Extension Test Page</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f5f1e6 0%, #efe7d4 100%);
      color: #1f2937;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(180, 83, 9, 0.18);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(78, 53, 20, 0.08);
    }
    h1 {
      margin-top: 0;
    }
    video {
      display: block;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      margin-top: 20px;
      background: #000;
    }
    code {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f5ebdb;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>扩展测试页</h1>
      <p>这个页面会直接暴露一个本地 MP4 地址，方便验证扩展是否能抓到视频候选资源。</p>
      <p>视频地址：<code>/outputs/AdvancedLivePortrait_test_2026-07-05.mp4</code></p>
      <video controls muted preload="metadata">
        <source src="/outputs/AdvancedLivePortrait_test_2026-07-05.mp4" type="video/mp4">
      </video>
    </section>
  </main>
</body>
</html>
